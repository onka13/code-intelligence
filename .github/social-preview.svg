<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- graph motif, right side -->
  <g stroke="#2a3560" stroke-width="2">
    <line x1="1010" y1="150" x2="1130" y2="250"/>
    <line x1="1010" y1="150" x2="900" y2="260"/>
    <line x1="900" y1="260" x2="1130" y2="250"/>
    <line x1="900" y1="260" x2="960" y2="380"/>
    <line x1="1130" y1="250" x2="1090" y2="390"/>
    <line x1="960" y1="380" x2="1090" y2="390"/>
    <line x1="1130" y1="250" x2="1200" y2="140"/>
    <line x1="900" y1="260" x2="820" y2="170"/>
  </g>
  <g>
    <circle cx="1010" cy="150" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1130" cy="250" r="22" fill="#1e293b" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="900" cy="260" r="28" fill="#38bdf8"/>
    <circle cx="960" cy="380" r="12" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="1090" cy="390" r="16" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="1200" cy="140" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="820" cy="170" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- title -->
  <text x="80" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f8fafc">Code Intelligence</text>
  <rect x="82" y="228" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#cbd5e1">A map of your codebase for AI coding tools.</text>
  <text x="80" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#cbd5e1">Tree-sitter. Deterministic. No embeddings.</text>

  <!-- stat -->
  <text x="80" y="470" font-family="Menlo, SF Mono, monospace" font-size="30" fill="#94a3b8">733,445 → 116,815 tokens</text>
  <text x="80" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#accent)">84% fewer tokens</text>
  <text x="80" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#64748b">on an 848-file Flutter + TypeScript + React project</text>

  <!-- footer -->
  <text x="1200" y="580" text-anchor="end" font-family="Menlo, SF Mono, monospace" font-size="24" fill="#64748b">github.com/onka13/code-intelligence</text>
</svg>
